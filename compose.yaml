services:
    database:
        image: mysql:8.0
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: Ldata
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - "./DB.sql:/docker-entrypoint-initdb.d/DB.sql:ro"
            - "database-data:/var/lib/mysql"
        networks:
            - mynetwork
        ports:
            - "3307:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 20s
    app:
        build: .
        environment:
            SERVER_SSL_KEY_STORE: file:/app/certs/localhost.p12
            DB_PASSWORD: ${DB_PASSWORD}
            DB_USERNAME: ${DB_USERNAME}
            KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USERNAME: ${SMTP_USERNAME}
            SMTP_PASSWORD: ${SMTP_PASSWORD}
            DB_HOST: database
            HMAC_SECRET: ${HMAC_SECRET}
        networks:
            - mynetwork
        container_name: app
        ports:
            - "8443:8443"
        volumes:
            - "./certs:/app/certs:ro"
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
    
    redis:
        image: redis:8-alpine
        container_name: linkflow-redis
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - mynetwork



networks:
    mynetwork:
volumes:
    database-data:

